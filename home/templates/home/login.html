<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Login | SS Car Care</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #102b46;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e1e8ef;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 12px 35px rgba(16, 43, 70, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-name {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .brand-subtitle {
            margin-top: 7px;
            font-size: 13px;
            color: #687887;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .description {
            color: #687887;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            height: 46px;
            border: 1px solid #d5dfe7;
            border-radius: 6px;
            padding: 0 13px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #164a7a;
        }

        button {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 6px;
            background: #164a7a;
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #102b46;
        }

        .messages {
            margin-bottom: 18px;
        }

        .message {
            background: #fff1f1;
            border: 1px solid #f0cccc;
            color: #a33a3a;
            padding: 11px;
            border-radius: 6px;
            font-size: 13px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #164a7a;
            text-decoration: none;
            font-size: 13px;
        }

        .security {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #8a98a5;
        }

    </style>

</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="brand">

            <div class="brand-name">
                SS CAR CARE
            </div>

            <div class="brand-subtitle">
                Vehicle Service Management
            </div>

        </div>

        <h1>
            Owner Login
        </h1>

        <p class="description">
            Sign in to manage customer bookings,
            vehicles, services and orders.
        </p>

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter owner username"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit">
                Sign In
            </button>

        </form>

        <a
            href="{% url 'home' %}"
            class="back-link"
        >
            ← Back to SS Car Care
        </a>

        <div class="security">
            Owner access only.
        </div>

    </div>

</div>

</body>

</html>
